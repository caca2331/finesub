# Builds and publishes a finesub release from the tagged snapshot.
#
# Triggered by hand (Actions -> Release -> Run workflow), not by pushing a tag:
# a release is a decision, and the person making it types the version. The
# workflow checks out `refs/tags/v<version>` explicitly, so what gets published
# is the tagged snapshot rather than whatever main happens to be at.
#
# `dry_run` builds and publishes nothing, and `dry_run_ref` lets it build a
# branch instead of a tag. Together they are the only way to exercise this file
# end to end without spending a tag or a version number, so run them after
# editing anything here. A real release ignores `dry_run_ref` -- it refuses to
# start, rather than quietly building something other than its own tag.
#
# One asset: the CLI wheel. It goes to the GitHub release first and to PyPI
# last, in that order because a PyPI version number cannot be reused while a
# GitHub release can be deleted and remade. (Until 0.5.0 this file also built,
# signed and shipped the desktop app -- six assets and a signing key. The
# `release` environment is still where PyPI Trusted Publishing is bound; the
# signing secret it holds is no longer read by anything.)
#
# Every input reaches a script through `env:`, never `${{ }}` inside a `run:`
# block: that substitution happens before the shell sees the line, so a quote
# in a release note would execute.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (e.g. 0.5.0)"
        required: true
        type: string
      release_notes:
        description: "Summary for the release body"
        required: false
        type: string
        default: ""
      dry_run:
        description: "Build the wheel, publish nothing"
        required: true
        type: boolean
        default: true
      dry_run_ref:
        description: >-
          Dry runs only: build this ref instead of the tag (e.g. main). Lets the
          release path be exercised without spending a tag or a version number,
          which is the entire point of having a dry run. Ignored -- and refused
          -- when dry_run is off.
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  # Resolves what to build in one place, and refuses the dry-run escape hatch
  # on a real release.
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Reading other workflows' conclusions for this commit.
      actions: read
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - id: resolve
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          DRY_RUN_REF: ${{ inputs.dry_run_ref }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ "$DRY_RUN" != "true" ] && [ -n "$DRY_RUN_REF" ]; then
            echo "::error::dry_run_ref is for dry runs only; a real release always builds its own tag" >&2
            exit 1
          fi
          if [ "$DRY_RUN" = "true" ] && [ -n "$DRY_RUN_REF" ]; then
            ref="$DRY_RUN_REF"
          else
            ref="refs/tags/v$VERSION"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "building $ref (dry_run=$DRY_RUN)"

      - name: The tests must be green for the commit being released
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
          REF: ${{ steps.resolve.outputs.ref }}
        # This workflow runs no tests of its own. Until now the only thing tying
        # a release to a green suite was procedure -- publish-main.ps1 gates main
        # on CI and you tag main -- which held because a human was in the loop.
        # Without a required reviewer nothing enforces it, so assert it here:
        # CI (all three of its jobs) must have concluded successfully for this
        # exact commit.
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/${REF#refs/tags/}" --jq .sha)
          echo "commit: $sha"
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$sha" --paginate --jq '.workflow_runs[] | select(.conclusion == "success") | .name')
          if printf '%s\n' "$runs" | grep -qxF "CI"; then
            echo "  CI: green"
          elif [ "$DRY_RUN" = "true" ]; then
            echo "::warning::no green CI run for $sha -- allowed because this is a dry run"
          else
            echo "::error::no successful CI run for $sha. Snapshot through scripts/publish-main.ps1 and tag the result." >&2
            exit 1
          fi

  build:
    needs: plan
    # Pinned rather than `windows-latest`: the runner image moves, and a release
    # should not land on a different toolchain than the one before it without
    # someone choosing that. ci.yml stays on `windows-latest` on purpose -- the
    # gate is where image drift should surface, loudly and early.
    runs-on: windows-2022
    timeout-minutes: 20
    # Deliberately no `environment`: nothing here needs a secret, and the pip
    # install runs third-party hooks as us.

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.ref }}

      - name: The ref being built and the tree must agree on the version
        shell: powershell
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $declared = (Get-Content -LiteralPath VERSION -Raw).Trim()
          if ($declared -ne $env:VERSION) {
            throw "asked for $env:VERSION, VERSION in this tree says $declared"
          }

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the build tool
        run: pip install -U pip build

      # The hand-pinned download URLs are reachable from no test: ci.yml skips
      # [asr] on purpose and nothing there fetches models or tools. 0.4.0
      # shipped pinning a CT2 wheel that was never published because of exactly
      # that hole, so the gate runs before anything is built.
      - name: Hand-pinned external URLs still resolve
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: .\scripts\check-pinned-urls.ps1

      - name: Build CLI wheel
        shell: powershell
        env:
          VERSION: ${{ inputs.version }}
        run: |
          .\cli\scripts\build-wheel.ps1 `
            -Python python `
            -OutputDirectory ".\dist\assets" `
            -Version $env:VERSION
          $expected = ".\dist\assets\finesub-$($env:VERSION)-py3-none-any.whl"
          if (-not (Test-Path -LiteralPath $expected)) { throw "missing asset: $expected" }
          Get-ChildItem ".\dist\assets" |
            Select-Object Name, Length |
            Format-Table -AutoSize |
            Out-String -Width 200 |
            Write-Host

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/assets/
          retention-days: 7
          if-no-files-found: error

  github-release:
    needs: build
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: assets

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --title "finesub $VERSION" \
            --notes "$RELEASE_NOTES" \
            assets/*

  pypi:
    # Last on purpose, and after the GitHub release rather than beside it: a PyPI
    # version number cannot be reused, while a GitHub release can be deleted and
    # remade. Published in parallel, a failure creating the release would leave a
    # wheel on PyPI pointing at a release that does not exist, and the only way
    # out is burning a version number.
    needs: [build, github-release]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      # Trusted Publishing: PyPI verifies this workflow's OIDC identity, so there
      # is no API token to store or rotate.
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: assets

      - name: Keep only the wheel
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p dist
          mv "assets/finesub-$VERSION-py3-none-any.whl" dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
