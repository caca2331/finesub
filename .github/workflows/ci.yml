name: CI

on:
  push:
    # ci-gate carries the snapshot that is about to become main, so this runs
    # before main moves rather than after -- fixing a red main means
    # force-pushing over a published branch.
    branches: [main, ci-gate]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # The suite runs in about two minutes. The cap is not for it -- it is for
    # `apt-get install ffmpeg`, which stalled twice in a row on 2026-08-18 and
    # would otherwise have sat there until the six-hour default. That matters
    # beyond one wasted runner: publish-main.ps1 blocks on this workflow, so a
    # hung apt mirror holds up a release until someone notices and cancels it
    # by hand. Fifteen minutes is "something is wrong", not a budget.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # No apt step. This job installs `.[harness,dev]`, and neither package it
      # used to pull is reachable from inside it: `soundfile` (which needs
      # libsndfile) lives in `[asr]` and is never installed here, and the tests
      # that want a real ffmpeg skip themselves when it is absent. The suite
      # runs green without it -- verified by stripping ffmpeg from PATH locally,
      # not by reading the tests: doing that first missed
      # `test_extract_window_clip_rejects_empty_range`, which reached
      # `resolve_ffmpeg` only because the production call resolved the binary
      # before validating its arguments (fixed in the same change).
      #
      # It was not free to keep: `apt-get install` stalled three times on
      # 2026-08-18, twice past ten minutes, and each stall blocked a release --
      # publish-main.ps1 gates on this workflow. Bring it back only alongside a
      # test that genuinely needs one of them, and pin what that test is.

      - name: Install dependencies
        run: |
          pip install -U pip setuptools
          pip install -e ".[harness,dev]"
          # numpy/soundfile belong to [asr], which this job deliberately skips;
          # tzdata is declared by [harness] now.
          pip install numpy soundfile
          pip install "torch~=2.9.0" "torchaudio~=2.9.0" --index-url https://download.pytorch.org/whl/cpu

      - name: Compile check
        run: python -m compileall -q src test

      - name: Run tests
        run: python -m pytest -q

  # The one Windows lane. It exists for what only Windows can execute, and it
  # runs those things by name so a skip on the ubuntu job above never stands in
  # for them: the CLI shell's own tests, the real-DPAPI envelope encryption that
  # protects users' API keys on disk (`skipif(os.name != "nt")` in
  # test_secrets.py), junction/robocopy semantics in fsops, and the wheel build
  # a release runs. Until 0.5.0 these rode along in the desktop's workflow;
  # deleting that would have deleted every execution of them.
  windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -U pip setuptools build
          pip install -e ".[harness,dev]"

      - name: Run CLI shell tests
        run: python -m pytest -q -n 0 cli/tests

      # `-rs` prints every skip. The point of this job is that these files run
      # here rather than skip, so a skip in this log is a finding, not noise.
      - name: Run the root-suite tests only Windows executes
        run: python -m pytest -q -n 0 -rs test/test_secrets.py test/bootstrap/test_fsops_links.py

      - name: Build CLI wheel
        shell: powershell
        run: |
          .\cli\scripts\build-wheel.ps1 `
            -Python python `
            -OutputDirectory "$env:RUNNER_TEMP\finesub-cli"
          $wheel = Get-ChildItem "$env:RUNNER_TEMP\finesub-cli\finesub-*.whl"
          if (-not $wheel) { throw "build-wheel.ps1 produced no wheel" }
          $wheel | Select-Object Name, Length | Format-Table -AutoSize | Out-String | Write-Host

  # The thin CLI's contract on its oldest supported interpreter: the wheel
  # builds and installs on 3.10 with nothing heavy, and `agent-clean` runs
  # without provisioning a managed runtime (docs/testing.md names this as a
  # guard). 3.10 rather than 3.12 because that is where a light-dependency
  # regression would show first.
  thin-cli-py310:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Build and install the thin CLI wheel
        shell: powershell
        run: |
          python -m pip install --upgrade pip build
          .\cli\scripts\build-wheel.ps1 `
            -Python python `
            -OutputDirectory "$env:RUNNER_TEMP\finesub-cli" `
            -Version "0.0.0"
          python -m pip install `
            (Get-ChildItem "$env:RUNNER_TEMP\finesub-cli\finesub-0.0.0-*.whl").FullName

      - name: Agent cleanup works without a managed runtime
        shell: powershell
        run: |
          $env:FINESUB_HOME = "$env:RUNNER_TEMP\empty-finesub-home"
          $env:LOCALAPPDATA = "$env:RUNNER_TEMP\empty-local-app-data"
          finesub agent-clean
          if (Test-Path "$env:FINESUB_HOME\runtime") {
            throw "agent-clean provisioned a managed runtime"
          }
