name: CI

on:
  push:
    # ci-gate carries the snapshot that is about to become main, so this runs
    # before main moves rather than after -- fixing a red main means
    # force-pushing over a published branch.
    branches: [main, ci-gate]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Every job here only reads the repository; without this line the token's
# scope would be whatever the repository settings default to.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # The suite runs in about two minutes. The cap is not for it -- it is for
    # `apt-get install ffmpeg`, which stalled twice in a row on 2026-08-18 and
    # would otherwise have sat there until the six-hour default. That matters
    # beyond one wasted runner: publish-main.ps1 blocks on this workflow, so a
    # hung apt mirror holds up a release until someone notices and cancels it
    # by hand. Fifteen minutes is "something is wrong", not a budget.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # The share Worker's JS tests (test/test_llm_knowledge_share_worker.py)
      # need `node:sqlite`, which the runner's preinstalled Node may lack; the
      # test skips without it, so this lane is where it is guaranteed to run.
      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      # No apt step. This job installs `.[harness,dev]`, and neither package it
      # used to pull is reachable from inside it: `soundfile` (which needs
      # libsndfile) lives in `[asr]` and is never installed here, and the tests
      # that want a real ffmpeg skip themselves when it is absent. The suite
      # runs green without it -- verified by stripping ffmpeg from PATH locally,
      # not by reading the tests: doing that first missed
      # `test_extract_window_clip_rejects_empty_range`, which reached
      # `resolve_ffmpeg` only because the production call resolved the binary
      # before validating its arguments (fixed in the same change).
      #
      # It was not free to keep: `apt-get install` stalled three times on
      # 2026-08-18, twice past ten minutes, and each stall blocked a release --
      # publish-main.ps1 gates on this workflow. Bring it back only alongside a
      # test that genuinely needs one of them, and pin what that test is.

      - name: Install dependencies
        run: |
          pip install -U pip setuptools
          pip install -e ".[harness,dev]"
          # numpy/soundfile belong to [asr], which this job deliberately skips;
          # tzdata is declared by [harness] now. torch is the version [asr] and
          # [cloud] pin, in its CPU build (test_packaging checks the pin).
          pip install numpy soundfile
          pip install "torch==2.11.0" "torchaudio==2.11.0" --index-url https://download.pytorch.org/whl/cpu

      - name: Compile check
        run: python -m compileall -q src test

      # pyflakes' rules over src/, test/ and cli/ ([tool.ruff] in pyproject);
      # the version is the one pinned in the `dev` extra installed above.
      - name: Lint
        run: ruff check

      - name: Run tests
        run: python -m pytest -q

  # The same suite with the optional packages that install as CPU wheels, so
  # the tests that skip themselves on the job above run here: cloud ASR and its
  # SBD model ([cloud]: scipy, onnx, sentencepiece, huggingface-hub,
  # silero-vad), recall repair's readings, the knowledge base's phonetic hints
  # ([kb-phonetic]), the numpy halves of the DiariZen and Nemotron ports
  # (librosa, safetensors), and fw-refine's unit tests (faster-whisper). The
  # job above stays as it is: it is the one that catches a module-level import
  # of an optional package in the harness-only install.
  #
  # [asr] itself is not installed: audio-separator and transformers are what
  # the heavy tests need, not this suite. Its CTranslate2 here is the stock
  # build, which cannot run fw-refine (docs/ct2-distribution.md); nothing in
  # the default suite decodes, and the one test that does is heavy_resource.
  extras:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -U pip setuptools
          # CPU torch first: [cloud] pins the same version, which this build
          # then satisfies, instead of PyPI's Linux build with several GB of CUDA.
          pip install "torch==2.11.0" "torchaudio==2.11.0" --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[harness,dev,cloud,kb-phonetic]"
          # From [asr] at its exact pins (test_packaging checks they match):
          # the reading libraries and the decoder. Then the two packages the
          # port comparisons import, which no extra declares.
          pip install "opencc-python-reimplemented==0.1.7" "pykakasi==2.3.0" "pypinyin==0.55.0"
          pip install "faster-whisper==1.2.1" "ctranslate2==4.8.1"
          pip install librosa safetensors

      # `-rs` lists what still skips: a test that should run here and does not
      # shows up in this log rather than passing silently.
      - name: Run tests
        run: python -m pytest -q -rs

  # macOS on Apple Silicon (3 cores / 7 GB / 14 GB disk, no Metal): the same
  # suite as the ubuntu job, on the platform the non-Windows skeleton added --
  # the Library data root, the obfuscated `.env` written 0600, device answers
  # on a machine with no CUDA. A CPU end-to-end run joins this lane once the
  # patched macOS CTranslate2 wheel is published: it is built by build-ct2.yml,
  # which only a later snapshot can reference (docs/ct2-distribution.md).
  macos:
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -U pip setuptools
          pip install -e ".[harness,dev]"
          pip install numpy soundfile
          pip install "torch==2.11.0" "torchaudio==2.11.0"

      - name: Compile check
        run: python -m compileall -q src test

      - name: Run tests
        run: python -m pytest -q

  # The one Windows lane. It exists for what only Windows can execute, and it
  # runs those things by name so a skip on the ubuntu job above never stands in
  # for them: the CLI shell's own tests, the real-DPAPI envelope encryption that
  # protects users' API keys on disk (`skipif(os.name != "nt")` in
  # test_secrets.py), junction/robocopy semantics in fsops, and the wheel build
  # a release runs. Until 0.5.0 these rode along in the desktop's workflow;
  # deleting that would have deleted every execution of them.
  windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -U pip setuptools build
          pip install -e ".[harness,dev]"

      - name: Run CLI shell tests
        run: python -m pytest -q -n 0 cli/tests

      # `-rs` prints every skip. The point of this job is that these files run
      # here rather than skip, so a skip in this log is a finding, not noise.
      - name: Run the root-suite tests only Windows executes
        run: python -m pytest -q -n 0 -rs test/test_secrets.py test/bootstrap/test_fsops_links.py "test/test_native_paths.py::test_the_crt_locale_switches_to_utf8"

      - name: Build CLI wheel
        shell: powershell
        run: |
          .\cli\scripts\build-wheel.ps1 `
            -Python python `
            -OutputDirectory "$env:RUNNER_TEMP\finesub-cli"
          $wheel = Get-ChildItem "$env:RUNNER_TEMP\finesub-cli\finesub-*.whl"
          if (-not $wheel) { throw "build-wheel.ps1 produced no wheel" }
          $wheel | Select-Object Name, Length | Format-Table -AutoSize | Out-String | Write-Host

  # The thin CLI's contract on its oldest supported interpreter: the wheel
  # builds and installs on 3.10 with nothing heavy, and `agent-clean` runs
  # without provisioning a managed runtime (docs/testing.md names this as a
  # guard). 3.10 rather than 3.12 because that is where a light-dependency
  # regression would show first.
  thin-cli-py310:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Build and install the thin CLI wheel
        shell: powershell
        run: |
          python -m pip install --upgrade pip build
          .\cli\scripts\build-wheel.ps1 `
            -Python python `
            -OutputDirectory "$env:RUNNER_TEMP\finesub-cli" `
            -Version "0.0.0"
          python -m pip install `
            (Get-ChildItem "$env:RUNNER_TEMP\finesub-cli\finesub-0.0.0-*.whl").FullName

      - name: Agent cleanup works without a managed runtime
        shell: powershell
        run: |
          $env:FINESUB_HOME = "$env:RUNNER_TEMP\empty-finesub-home"
          $env:LOCALAPPDATA = "$env:RUNNER_TEMP\empty-local-app-data"
          finesub agent-clean
          if (Test-Path "$env:FINESUB_HOME\runtime") {
            throw "agent-clean provisioned a managed runtime"
          }
