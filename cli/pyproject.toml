# The publishable FineSub CLI shell. This is NOT the repository's development
# pyproject: the wheel built from here contains the thin launcher plus a
# vendored snapshot of the pipeline sources (finesub_cli/_vendor), and exposes
# only the `finesub` entry point -- the heavy [asr] stack is never installed
# into the shell's venv; the launcher provisions a uv-managed runtime instead.
# Build with cli/scripts/build-wheel.ps1, which stages the vendored tree and
# stamps VERSION from the repository-root VERSION (one release line, one
# version number -- the root pyproject reads the same file).

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "finesub"
dynamic = ["version"]
description = "Local long-form audio to subtitles: vocal separation, VAD+ASR alignment, stabilization, LLM correction/translation (managed-runtime CLI)"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
keywords = ["subtitles", "asr", "whisper", "srt", "speech-to-text", "translation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

# uv is pinned to the exact version the desktop runtime-manifest downloads, so
# both products build the runtime with the same resolver; guarded by
# desktop/scripts/tests/test_desktop_dependencies.py.
dependencies = [
    "uv==0.11.32",
    "pydantic>=2.7",
    "httpx>=0.27",
    # `[cli] update_check = false` is a documented promise, and reading it needs
    # a TOML parser. 3.11+ has one in the stdlib; 3.10 (which this wheel still
    # supports) does not. Without the backport the shell cannot tell whether the
    # user opted out, and `_config_says_no` then fails closed -- keeping the
    # promise, but at the cost of the notice for every 3.10 user.
    "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/caca2331/finesub"
Releases = "https://github.com/caca2331/finesub/releases"
Documentation = "https://github.com/caca2331/finesub#readme"

[project.scripts]
finesub = "finesub_cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["finesub_cli"]

[tool.setuptools.dynamic]
version = {file = "VERSION"}
