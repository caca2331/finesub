# Streamer subject preset —— v2（行文法 v3：`[标记] 行体`）
#
# 行文法 v3
# ---------
#   [本名] 四月一日べレト（わたぬき べレト）/ 四月一日贝蕾特       标记 + note 体
#   [自称] ワタヌキ|我|わたぬき|读评论或第三方提及时译作「四月一日」  标记 + term 体
#          ワタヌキ|我|わたぬき|…                               无标记 + term 体
#          游戏实况，主打《原神》《崩坏：星穹铁道》…                无标记 + note 体
#
# * 标记是可选前缀，方括号本身就是消歧符——**标记名不需要闭合词表**，
#   `[出道] 2022-12` 合法，`[音域] …` 也合法（`allow_custom_labels`）。
# * 行体的 kind 由它自己的形状定：≥4 段竖线 ⇒ term，恰好 3 段 ⇒ invalid，其余 ⇒ note。
#   `body_kinds` 限定这一节允许哪些行体。
# * 同一节内标记唯一（替代旧的按行去重）。
# * 冒号不再有任何语法作用 —— `sep` payload 键随本版消失。
#
# section 没有 tier
# -----------------
# 渲染规则按**预览档位**定，不按重要性定：
#   完整预览（用户 / 知识更新任务）  所有节全渲染，空节也渲染——模型得知道有这个节。
#   部分预览（其余 LLM 任务）        空节不渲染。
# preset 的节列表本身就是「该收集什么」的清单。
#
# labels 是登记表，不是词表
# -------------------------
# 「登记」与「core」是两件事：
#   core = true   缺失就提醒；完整预览渲染出空槽，**但库里不插空行**（稀疏＝缺席）
#   core = false  只为携带 role / share 之类元数据，不占槽、不提醒
#   表外标记      合法（allow_custom_labels），不占槽、不提醒；共享策略走
#                 unknown_label_share —— **fail-closed，不随本节默认自动继承**

version = 2
name = "streamer"
allow_custom_labels = true
unknown_label_share = "local"   # 未登记的标记永不自动共享（可能是「中之人」这类）
unknown_label_verify = "none"   # 也永不发给外部检索核查
strict_sections = true          # 六节固定，不可新建
                                # （「重要经历」退休；「说话风格」并入「特点」；新增「待归类」暂存区）

[[sections]]
name = "档案"
body_kinds = ["note"]
verify = "external"
purpose = "条目身份：这条目是谁、归属何处。"
exclude = "近况、版本性叙事、单场直播的轶事；称呼类信息去「频道用语」。"
labels = [
  { name = "本名", core = true, role = "identity", note = "源语言全名 / 中文定名 / 英文定名（源语言定名已是英文则留空），斜杠分隔；条目的 index 行由它派生" },
  { name = "别名", core = true, role = "aliases", note = "顿号分隔：昵称、简称、全称、俗称，以及源语言的特殊读音（假名写法）。覆盖社区常用写法，至少 2 字符；不罗列牵强或极少使用的写法。误听变体不算别名（会污染匹配）。这一行渲染自 items，删掉整行不等于清空别名" },
  { name = "人设", core = true, note = "外貌之外的人物设定：性格、身份、定位——影响译文口吻" },
  { name = "外观", core = true, note = "外貌特征：发色瞳色、标志性配饰与服装——多模态任务据此辨认" },
]
# 常见的表外标记（不占槽、不提醒）：[出道] [生日] [身高]。
# 事务所/个人势写成本节的无标记 note 行。

[[sections]]
name = "直播内容"
body_kinds = ["note"]
verify = "none"
purpose = "常态直播内容的类别，用来判断语境（常玩的游戏、常做的企划）。"
exclude = "单场节目的经过与感想。"
labels = []

[[sections]]
name = "频道用语"
body_kinds = ["term"]
verify = "external"
purpose = "频道自造词、固定称呼与固定台词——ASR 易错且有固定译法的表层：自称、他称、粉丝名、吉祥物、固定环节名，以及问候/结束的定式。"
exclude = "通用游戏名词（那属于 common 条目）；不收只出现过一次的临时梗。定式只收每场都说的那句，不收偶尔说的。"
labels = [
  { name = "自称", core = true, note = "中文列填「可确定为自称时的译法」，描述里写第三方提及时的译法" },
  # 登记但非 core：不是每个主播都有固定问候语/结束语，留空槽会让每个条目都多两行提醒。
  # 登记的作用是让它们继承本节的 inherit 共享策略——表外标记 fail-closed 成 local，跨库共享会丢。
  { name = "问候语", note = "每场开头都说的那句定式（打招呼、自报家门），连读法一起收；译文要固定，同一条目每次都译成同一句" },
  { name = "结束语", note = "每场收尾都说的那句定式（道别、下次预告）；同上，译法固定" },
]
# 常见的表外标记：[他称] [粉丝名]。

[[sections]]
name = "特点"
body_kinds = ["note"]
verify = "none"
purpose = "会改变译文选择的稳定特征：说话方式、声音、以及影响译名与称呼判断的喜好倾向。"
exclude = "剧情感想、追番轶事、与字幕判断无关的趣闻——现库这一节大半属此类。新增前先问「它会改变某一句译文吗」。称呼去「频道用语」。"
labels = [
  { name = "语体", core = true, note = "**文字线索**：敬体/常体、方言与语种、是否代读无配音台词——决定译文语气与用词" },
  { name = "音色", core = true, note = "**声音线索**：声线与发音特征。额外用途：多模态模型据此区分说话人" },
]

[[sections]]
name = "人际关系"
verify = "none"              # 真人关系不发给外部检索——转 term 体不得改变这条
body_kinds = ["term"]
purpose = "会被念出来的真实关系人名字（人/组织）及其译名——它们和术语一样会被 ASR 听错。"
exclude = "关系的具体故事，一句话说清是谁即可；本人法定姓名类信息属于「档案」的 [本名]。"
labels = []

[[sections]]
name = "待归类"
verify = "none"
staging = true                  # 非空即出信号：报告里列行数，建议归位或删除。转运站，不是仓库。
body_kinds = ["note", "term"]
purpose = "暂存区：确实会影响译文、但不属于本条目任何一节的内容。写清楚它影响什么。"
exclude = "不是垃圾场——不满足其他节收录标准的内容不会因为放进这里就变得该收。也不是碎片词条的替代出口：属于别的词条的内容直接写到那个词条去。"
labels = []

# 共享策略按 SECTION 决定（人际关系改 term 体后，按 kind 判会绕过本表），
# 单个标记可用 labels 里的 `share = "local"` 覆盖本节默认——streamer 目前无一例外，
# 但真要记「中之人」这类信息时，覆盖点在标记上，不必把整节降级。
[share_inherit]
"档案" = "inherit"          # 本名/别名/人设都是公开的角色设定，正是被共享方要的
"直播内容" = "inherit"
"频道用语" = "inherit"
"特点" = "inherit"
"人际关系" = "inherit"      # 内容是粉丝面的通称（パパベルト 之类），不是法定姓名
"待归类" = "local"          # 暂存区不外发
