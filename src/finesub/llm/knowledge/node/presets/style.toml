# Style subject preset —— v2（行文法 v3，语法说明见 streamer.toml 头部）
#
# 一个 style = 一个 entry
# -----------------------
# 一家字幕组（或一位译者）的整套口味是**一个条目**，每条约定是这个条目「约定」节里的
# 一行。行就是 node：它有自己的版本行、自己的 evidence、自己的 visibility、自己的 sync
# 合并粒度，所以置换一条约定是一次 `update`，融合两条是 `update` + `remove`，被删掉的
# 那条留在版本历史里，`knowledge revert` 能整体回退。
#
# 规则怎么和它的例子配对
# ----------------------
# 一个 node 装不下结构（行不能挂子行），所以约定、正例、反例是三个节里的三行，靠**标记**
# 配对：`[引用标注]` 的约定、`[引用标注]` 的正例、`[引用标注]` 的反例是同一条规则的三面。
# 这不是新语法——「同一节内标记唯一」是 apply 引擎已有的校验，于是「一条约定至多一个正例、
# 至多一个反例」不用写任何代码，孤例（标记在「约定」里找不到）也是可机器判定的。
# 一条约定想要更多例子时的出口是**不带标记的例子行**：它合法，只是不参与配对，读作这套风格
# 的一般性例子。（"至多一个配对例子"是方案自己的取舍——注入面有界，不是语法逼出来的。）
#
# 例子一律单行：一条字幕本来就是一行；多个 cue 合并成一句的例子，源那边用 ` | ` 连起来
# （管线连多人行用的就是它，只收 note 的节里竖线只是字符）。句内真有换行按素材原样写 \N。
#
# style 与其余两类的两处不同
# --------------------------
# 1. **不进匹配面**（`node/model.py` 的 `MATCHABLE_CATEGORIES`）：专名条目是「从文本里按
#    名字/别名匹配到」，style 是「按 `--style` 显式点名」。进了匹配面不但会被文本误命中，
#    `create_entry` 的全局查重还会拒绝一条与某个专名条目同名的 style——而 style 通常就以它
#    服务的字幕组或主播命名。代价是名字唯一性要自己保证 —— `repo.resolve_in()` 按命名空间
#    查重，style 的命名空间就是 style 自己（两条同名 style 照样撞）。
# 2. **verify 全是 `none`**：style 没有外部真相，一条约定的正确性不取决于任何可检索的
#    事实，永远不发给外部检索核查。

version = 2
name = "style"
blurb = "一套翻译口味，点名选取或自动选择后注入"   # 结构表里这个类别的一句话说明
matchable = false               # 不进匹配面：只按 --style 点名，因此也没有索引（理由见本文头部第 1 条）
allow_custom_labels = true
unknown_label_share = "local"   # 未登记的标记 fail-closed，不随节默认继承共享
unknown_label_verify = "none"
strict_sections = true          # 五节固定，不可新建
# 整条的注入上限（owner 2026-10-02，三个类别一样）：逐节上限乘起来仍可能塞满一个窗口，所以
# 注入时整条超过这个 token 数就按行截断（`injection_budget`）。它**不是写入规则**——超了照写，
# 压缩靠更新任务看到的提示。
max_entry_tokens = 6000
# 超过软阈值时，可写的面提示压缩。不可拆：style 按名字静态选取，拆出去的约定会离开 --style。
soft_entry_tokens = 5000
splittable = false

[[sections]]
name = "档案"
body_kinds = ["note"]
verify = "none"
purpose = "这套风格是谁的、对什么素材成立。"
exclude = "具体怎么做——那是「约定」。"
labels = [
  { name = "本名", core = true, role = "identity", note = "这套风格的名字，也就是点名选取时写的那个串；通常是字幕组名或译者名" },
  { name = "作者", core = true, note = "这套风格是谁的口味；自由文本，只给人看，不需要可验证" },
  { name = "适用范围", core = true, note = "对谁成立（该组全部投稿 / 某主播 / 某题材）。自动选择风格时按它和简介挑，要写具体；点名选取时它不参与判断" },
  # 档位与比例的对应在 `length_tier.TIER_RATIOS`（偏短 0.8、标准 1.0、偏长 1.25），两处的三个名字由测试钉成一样。
  { name = "字幕长度", values = ["偏短", "标准", "偏长"], note = "这套风格要的字幕长短，合并行的长度上限按它定。用户要字幕偏长（少拆）或偏短时写这一行，不写成约定（句子本身写长写短归约定）；没提过长短就不写" },
  # `style.CORRECT_ONLY_TASK`: a correct-only task (a Chinese source) injects only styles whose 任务 names it.
  # Only people write it (owner 2026-11-07): no model preview shows this note, and the knowledge update holds every
  # change to the line (`proposals.hidden_label_gate`).
  { name = "任务", model_hidden = true, note = "这套风格写给哪种任务。写了「中文纠错」，中文素材只纠错、不翻译的任务也整份用它（可以和别的并写，如「翻译、中文纠错」）；没写的只用于翻译" },
]

# 上限：**owner 2026-09-02 拍的粗值，随时可改**——每节 20 行 × 200 字（含 [标记]）。
# 它不是标定出来的（原打算由方案 §4 的实验来定，owner 判定不值得单独跑）。preset 是节规则
# 的唯一真相，apply 引擎与 prompt 说明都从这里取；换值只改这几行。
#
# 逐节上限只管「一行多长、一节多少行」；三节都逼近各自上限时整条仍可能很大，所以顶上还有
# `max_entry_tokens` 这道注入上限。
[[sections]]
name = "约定"
body_kinds = ["note"]
verify = "none"
max_lines = 20
max_body_chars = 200
purpose = "一句祈使式的做法，一行一条——**唯一会被当作规则读的一节**。每条带一个 `[标记]` 作短名，正例/反例用同一个标记指回来。条数与单条长度都有上限，满了要加新的就得退掉旧的或把两条并成一条。"
exclude = "理由与解释（一行写不下，说明这条该拆成两条）；某个专名怎么译（那是对应词条的术语行，不是风格）；「翻译要准确」这类对谁都成立、不带这套口味的话。"
labels = []

[[sections]]
name = "正例"
body_kinds = ["note"]
verify = "none"
labels_from = "约定"   # 带标记的例子必须指向一条真实存在的约定（孤例过不了整批校验）
max_lines = 20
max_body_chars = 200
purpose = "照着约定做出来的译文，`[标记] 原文 → 译文` 一行一例，标记就是它演示的那条约定。箭头两边只应差在这条约定上：顺手带进来的无关改动（专名定名、别的约定）先改掉，否则这一例同时演示了两件事。举例是为了让约定不被误读，不是为了穷举——一条约定至多一个正例（标记在节内唯一）。"
exclude = "带标记却在「约定」里找不到那条规则的孤例——它证明不了任何东西，只会占注入面（无标记的一般性例子不算孤例）。"
labels = []

[[sections]]
name = "反例"
body_kinds = ["note"]
verify = "none"
labels_from = "约定"
max_lines = 20
max_body_chars = 200
purpose = "违反约定的译法，同样 `[标记] 原文 → 译文`。⚠ 箭头右边必须是**那个不该出现的译文本身**，不是「为什么不行」的说明——两边都是译文，这一节才和正例可比；理由要写就补在行尾括号里。一条约定至多一个反例。"
exclude = "与风格无关的错译（歪曲原意、丢信息）——那是纠错的事；精修与机器译文的差异本身也不等于错。"
labels = []

[[sections]]
name = "待归类"
verify = "none"
staging = true                  # 非空即出信号：报告里列行数，建议归位或删除
body_kinds = ["note"]
purpose = "暂存区：确实是这套口味的一部分、但还没想清楚算哪一节的内容。"
exclude = "不是垃圾场——不满足其他节收录标准的内容不会因为放进这里就变得该收。"
labels = []

# 风格是口味，默认不外发：整条 `knowledge share mark` 之后，仍要逐行勾选才进共享候选。
# 这里逐节写出来是为了让「默认 local」是一个决定，而不是一次遗漏。
[share_inherit]
"档案" = "local"
"约定" = "local"
"正例" = "local"
"反例" = "local"
"待归类" = "local"

