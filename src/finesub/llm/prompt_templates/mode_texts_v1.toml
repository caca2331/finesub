# 纠错 prompt（与准备任务里说到翻译的几句、pass 1 的定形状一节）里随任务模式变的字句与规则里举的例子：翻译（默认）与只纠错（中文源，docs/llm_prompts.md「只纠错」：
# 两列，corrected_text 是忠实转写、polished 是在它上面做局部编辑的字幕版）。
# 键是模板里的 $占位名。翻译一组就是翻译任务的字句，改它就是改翻译 prompt（纠错 prompt 与 pass 1 由快照钉着；prep_、style_ 等其余路径没有快照，见 docs/llm_prompts.md「只纠错」）；
# 只纠错一组渲染出的 prompt 里不得出现「译」「translation」（守卫测试钉着；知识库标记「音译」与查询规则里的「中日互译」除外），
# 也不得出现假名：举的例子用中文，示范读 examples_zh/。

