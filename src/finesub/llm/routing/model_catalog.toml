max_input_tokens = 1000000
max_output_tokens = 256000
context_window = 1000000
thinking = ["high", "low", "low"]
capability = "medium"
note = """
`deepseek-flash` 是官方 API 给 V4.1 Flash 的名字，不带版本号。2026-09-12 实测（dsh 0.1.5-rc.1）：传
`deepseek-v4.1-flash` 被拒，报错列出的受支持名只有 deepseek-flash / deepseek-v4-pro；CodeBuddy 服务端认的
却是带版本的 `deepseek-v4.1-flash`，两边各按各的写。模型名记的是 api_model_id 今天指向的版本：上游换代时
改模型名与 display_name，api_model_id 不动；1000000 / 256000 与 dsh 的默认值一致，换代时重新核一次。
dsh 的联网搜索由自带的 DeepSeek 搜索插件提供，要绑 DeepSeek 的 API key（与跑模型的 key 无关），每次搜索会扣少量费用。
"""

