[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finesub"
# The one version number, read from the repository-root `VERSION`. It used to
# be a literal here *and* in `desktop/VERSION`, kept equal by a test; the
# desktop split left the file with no owning subdirectory, so it moved to the
# root and both readers now point at it -- `cli/pyproject.toml` already reads a
# file called `VERSION`, and `cli/scripts/build-wheel.ps1` stamps the wheel
# from this one.
dynamic = ["version"]
description = "Local ASR and subtitle pipeline for long-form audio (finesub)."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "caca2331" }]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = []

[project.optional-dependencies]
# Through *-stable.json: vocal separation, VAD, Whisper ASR, JSON/SRT tools.
# Wants a GPU (>=8GB VRAM recommended) but runs without one; AMD goes through
# `asr-win-rocm` on Windows and through this extra on Linux (torch from the ROCm
# index). >=8GB free system RAM, ffmpeg on PATH.
asr = [
  # Exact versions, and they move together or not at all. Four things are keyed
  # to the torch build: torchaudio and torchvision by their own pins, triton by
  # nothing at all (it declares no torch constraint, so a range lets the
  # resolver pair them wrongly), and the patched CTranslate2 by the cuBLAS
  # SONAME it loads at runtime.
  #
  # 2.11 is the last release with a matching torchaudio - it stops there - and
  # the last on cu128. 2.12 moves to cu130, whose torch ships cublas64_13 while
  # CT2 looks for cublas64_12, and it changed one ASR transcription in testing.
  #
  # 2.9/2.10/2.11 were each run end to end. Against the 2.9 corpus, 2.11 leaves
  # ASR text identical and separation within 2.75e-4 (SNR 74.42dB, well inside
  # E0's 71.4dB bar) - close but not bit-identical, so benchmark numbers taken
  # on 2.9 do not transfer exactly. See README_DEV.md "torch 版本范围".
  #
  # Install from download.pytorch.org: the CUDA builds carry a +cu128 local
  # label, and PyPI may serve a build without CUDA.
  "torch==2.11.0",
  "torchaudio==2.11.0",
  "torchvision==0.26.0",
  # Ships a bundled TinyCC, so the compiled path needs no Visual Studio.
  "triton-windows==3.6.0.post26 ; platform_system == 'Windows'",
  "numpy",
  "soundfile",
  # fw-refine is the only ASR backend, so these are not optional. Pinned exactly:
  # it subclasses faster-whisper internals (seek loop, generate_with_fallback,
  # word-timestamp assembly) and reads a decoder trace only the patched
  # CTranslate2 emits, so a minor bump on either side can move output silently.
  # Upgrade faster-whisper first -- it is what bounds the CTranslate2 range.
  #
  # NOTE: stock 4.8.1 satisfies this pin but cannot run fw-refine; that is caught
  # at runtime by RefinedWhisperModel.__init__. Once the patched wheel is
  # published, replace this with a direct reference to the release asset so the
  # resolver rejects stock outright. See tools/wt_refine_port/ct2-patches/README.md.
  "faster-whisper==1.2.1",
  "ctranslate2==4.8.1",
  "scipy",
  "onnxruntime",
  # Capped: the demix runner takes its step from the separator's `overlap`
  # (speech/preprocessing/separator/demix.py), and 0.47 turned that into the
  # checkpoint YAML's overlap count -- 2 on ours, so the step would drop from
  # the 8s chunk to 2s: four times the forward passes and a different stem,
  # with no error. Lift the cap only together with the demix runner.
  "audio-separator<0.47",
  "numba",
  # Two-signal VAD post-pass (--vad-silero-assist, on by default); ships its model.
  "silero-vad",
  # Second-model verification evidence (--qwen-verify, docs/vad-asr.md):
  # Qwen3-ASR-0.6B-hf through native transformers (~100MB pip increment;
  # the 1.5GB model downloads to the HF cache on first use, like the
  # separator models). In [asr] rather than an extra so the same command
  # yields the same stable output on every install. tokenizers 0.22-0.23
  # and huggingface-hub 1.x from this line sit inside faster-whisper's
  # declared ranges. (The qwen-asr wrapper + non-hf checkpoints were
  # rejected: exact transformers pin, an unused gradio/flask/nagisa
  # payload, and a --no-deps install this file cannot express. Same
  # weights; parity verified.)
  "transformers>=5.13,<6",
  # Readings for recall repair's sound matching (speech/postprocessing/
  # recall_sounds.py): kana via pykakasi, pinyin via pypinyin, traditional to
  # simplified via opencc. Pinned exactly: a reading changes with the version,
  # and the matching thresholds were accepted on these (docs/asr-stabilize.md).
  "opencc-python-reimplemented==0.1.7",
  "pykakasi==2.3.0",
  "pypinyin==0.55.0",
]
# `[asr]` with AMD's Windows torch line instead of the CUDA one. AMD publishes
# Windows ROCm wheels only at repo.radeon.com, and that line stops at 2.9.1
# (rocm-rel-7.2.1, checked 2026-09-17) -- so `[asr]` would replace the user's
# ROCm torch with the CUDA-less PyPI 2.11.0, silently, and the card would go
# unused. None of the four bindings above holds here: the HIP CTranslate2 never
# loads cuBLAS, triton is not used (Windows ROCm runs the separator eager), and
# AMD ships the matching torchaudio/torchvision itself. 2.9 is also the line the
# benchmark corpus was taken on (README_DEV.md "torch 版本范围").
#
# ⚠ This extra is temporary by construction: when AMD's Windows line reaches
# 2.11.0, delete it and send Windows + AMD back to `[asr]` (owner 2026-09-17).
#
# ⚠ Everything except the torch line must stay identical to `[asr]` --
# `test_the_amd_windows_extra_differs_from_asr_only_in_the_torch_line` fails
# otherwise. It is a copy rather than `finesub[...]` on purpose: this project
# and the published CLI share the name `finesub`, so a self-referencing extra
# invites a resolver to fetch the CLI from PyPI instead of the checkout.
asr-win-rocm = [
  "torch==2.9.1",
  "torchaudio==2.9.1",
  "torchvision==0.24.1",
  "numpy",
  "soundfile",
  "faster-whisper==1.2.1",
  "ctranslate2==4.8.1",
  "scipy",
  "onnxruntime",
  "audio-separator<0.47",
  "numba",
  "silero-vad",
  "transformers>=5.13,<6",
  "opencc-python-reimplemented==0.1.7",
  "pykakasi==2.3.0",
  "pypinyin==0.55.0",
]
# From stable.json onward: LLM correction/translation harness only.
# No GPU / torch required; >=4GB system RAM; ffmpeg + ffprobe on PATH; API keys in .env.
harness = [
  # Ed25519 for knowledge-share snapshot signatures (share/signing.py): a
  # pull must be able to tell the maintainer's snapshot from one anybody with
  # the mailbox token published.
  "cryptography>=42",
  "httpx",
  "opencc-python-reimplemented",  # 繁→简归一 for knowledge-entry key matching
  # finesub/llm/rate_limit.py resolves America/Los_Angeles at import time to align the
  # Gemini daily quota window. Windows ships no tz database, so without this
  # the whole LLM layer fails to import -- which is how it reached CI as an
  # ad-hoc `pip install tzdata` line instead of a declared dependency.
  "tzdata ; platform_system == 'Windows'",
]
# What the managed runtime needs on top of [asr]+[harness]. Never installed by
# name: it exists to be compiled -- with [asr] and [harness] -- into
# src/finesub_bootstrap/pylock.win-py312.toml, which is what the CLI shell
# installs into the runtime it provisions (the command is in the lock's header;
# docs/ct2-distribution.md "锁的重建" has the rest).
runtime = [
  # `finesub_bootstrap` models its manifests with pydantic, and the pipeline
  # the shell re-executes inside the runtime imports that package.
  "pydantic>=2,<3",
  # yt-dlp is deliberately NOT here: managed runtimes provide it as an
  # on-demand manifest resource joined via PYTHONPATH (reusing a system copy
  # when present), and source installs treat it as opt-in. See
  # finesub_bootstrap.system_tools / runtime-manifest.json.
  # The direct reference [asr] deliberately avoids (docs/ct2-distribution.md
  # "安装约束"): it pins the platform triple, which is fine *here* because the
  # managed runtime is win_amd64 / cp312 / cu128 and nothing else. Without it
  # the lock resolves stock 4.8.1 -- installs cleanly, then fails at ASR start,
  # since only the patched build emits the WT refine trace. The `#sha256=` is
  # the lock's, so a direct `pip install .[runtime]` checks the wheel too
  # (test_packaging keeps the two equal).
  "ctranslate2 @ https://github.com/caca2331/finesub/releases/download/ct2-4.8.1%2Bfinesub0.6.0/ctranslate2-4.8.1+finesub0.6.0.cu128-cp312-cp312-win_amd64.whl#sha256=7567ef160cccea178c4b0accdb18ff35812b7a198b60419208ce8567b392c63b",
]
# Cloud ASR (`--asr mai2|gemini-35t|moss-pro`, docs/manual/joint-asr.md) without
# the local GPU stack: through *-stable.json and -raw.srt with the transcription
# done by a cloud service. torch runs on the CPU here (Silero VAD for MOSS Pro's
# timing); torch, torchaudio, numba and scipy are here because the pipeline
# imports the local stack's modules at import time, not because cloud ASR uses
# them. The pins follow `[asr]` so that installing both resolves. The forced
# aligner (`--asr-aligner`) also needs `transformers` from `[asr]` (D10: heavy
# packages only where they are used). Checked by hand (a venv with this extra
# alone imports the pipeline and runs the cloud tests); nothing in CI installs it
# alone, so a module-level import of an `[asr]`-only package would go unnoticed.
cloud = [
  "torch==2.11.0",
  "torchaudio==2.11.0",
  "numpy",
  "soundfile",
  "scipy",
  "numba",
  "httpx",
  # 35t Live, which the 35t repair asks (speech/joint/live.py): a WebSocket, which httpx does not speak.
  "websocket-client",
  "silero-vad",
  # 35t's sentence-boundary model (speech/joint/sbd.py): ONNX on the CPU, its
  # graph re-exported once with the pre-threshold tensor as an output.
  "onnx",
  "onnxruntime",
  # 0.2.2: character offsets through `offset_mapping` (the older offset form is gone).
  "sentencepiece>=0.2.2",
  "huggingface-hub",
  "tzdata ; platform_system == 'Windows'",
]
# Offline probes under `tools/bench/` (today: P18's SBD model and its gate).
# `tools/` is maintained on demand, but the reproduce commands in
# `docs/bench-baselines.md` need these, and a dependency that only exists in a
# shell history is not a declared dependency. The model itself runs on what
# `[cloud]` carries (35t uses it in production); only the gate needs more.
bench = [
  "onnx",           # re-export a pre-threshold tensor as a graph output
  "sentencepiece>=0.2.2",  # the SBD model ships its own sp.model
  "scikit-learn",   # the gate's logistic + AUC
]
# Japanese readings for the correction windows' slimmed knowledge entries and
# phonetic hints (finesub/llm/kb_phonetic_hints.py, developer switch
# FINESUB_KB_SLIM, off by default). Not in [harness], and so not in the runtime
# lock: the switch is off, and pyopenjtalk-plus brings sudachi and its ~210 MB
# dictionary. Without it the switch warns and injects whole entries. pykakasi
# alone was measured as the reader and recalled less. Moves into [harness] and
# the lock if the default ever flips.
kb-phonetic = [
  "pyopenjtalk-plus>=0.4.1",
  "pykakasi>=2.3",
  "rapidfuzz>=3",
]
dev = [
  # `finesub_bootstrap` models the manifests it parses with pydantic, and the
  # root suite now covers that layer (test/bootstrap). It stays out of
  # `[harness]`: a harness install runs the LLM layer, which only reaches
  # `finesub_bootstrap.secrets` -- deliberately stdlib-only for that reason.
  "pydantic>=2,<3",
  "pytest",
  # A hung test is otherwise a hung CI job with no output: the suite starts
  # real subprocesses (agent drivers) and real local HTTP servers.
  "pytest-timeout",
  "pytest-xdist",
  # `ruff check` ([tool.ruff] below; CI's test job runs it). Exact: a new
  # release can add findings to the F rules and turn CI red on its own.
  "ruff==0.16.7",
]

# No `[project.scripts]`, on purpose. The one command this project puts on a
# user's PATH is `finesub`, and it comes from the CLI wheel (`cli/`), which
# provisions the managed runtime before dispatching. Installing this
# distribution as well would put a second, unprovisioned `finesub` in the same
# place. Everything the fourteen former scripts did is reachable as
# `python -m finesub.<module>`; `test_packaging` keeps those runnable.

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["finesub*", "finesub_bootstrap*"]

# Every tracked non-Python file under src/ has to match one of these, or a
# `pip install .` ships without it (test_packaging checks).
[tool.setuptools.package-data]
"finesub.llm" = ["prompt_templates/*.md", "prompt_templates/*.toml", "prompt_templates/*/*.md"]
"finesub.llm.knowledge.node" = ["presets/*.toml", "presets/legacy/*.toml"]
"finesub.llm.routing" = ["model_catalog.toml", "model_routes.toml"]
"finesub_bootstrap" = ["*.json", "*.toml"]

# Lint: pyflakes' rules only (undefined names, unused imports and variables),
# over the package, its tests and the CLI shell -- `ruff check` from the
# repository root. `tools/` (maintained on demand) and `explore/` (one-off
# experiments) stay out, as does everything else outside those three. The
# version is pinned in the `dev` extra, which is what CI installs.
[tool.ruff]
include = ["src/**/*.py", "test/**/*.py", "cli/**/*.py"]

[tool.ruff.lint]
select = ["F"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["test"]
python_files = ["test_*.py", "*_test.py"]
# Four workers (owner 2026-10-24): every worker loads CUDA torch (~1.3 GiB committed,
# ~0.5 GiB resident), and eight left the machine short of memory beside a game; four
# costs about half a minute on the full suite. `--timeout` bounds a hang rather than a slow
# test: the slowest single case measures ~3.3s, so 120 is two orders of
# magnitude of headroom, and heavy-resource cases raise it themselves.
addopts = "-n 4 --timeout=120"
markers = [
  "heavy_resource: tests that may load models, process media, or use significant GPU/RAM; skipped unless --run-heavy-resource is passed",
  "requires_main_checkout: tests whose contract requires the repository to be the main checkout; skipped in linked git worktrees",
  "network_mock: tests that stand up real local sockets to prove a route end to end; skipped unless --run-network-mock is passed",
  # The three domain markers partition the suite: every test file carries
  # exactly one, and test_packaging.py fails if a new file carries none.
  "llm: LLM harness tests (auto-applied to test_llm_*.py)",
  "pipeline: pipeline/batch orchestration plus the runtime and provisioning it stands on (GPU and thread budgets, device resolution, separator plumbing, reporting, config, secrets, state)",
  "asr: the audio -> words -> subtitle path (VAD, decoding, alignment, stabilization, segmentation) and its text utilities",
]
